<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>VaultNova</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root,[data-theme="dark"]{
  --bg:#060810;--surface:rgba(8,12,30,.98);--card:rgba(6,14,40,.92);
  --accent:#4fc3f7;--accent2:#7c4dff;--gold:#ffd54f;--ok:#69d475;--err:#ef5350;
  --text:#d0e8ff;--muted:#4a6a8a;--border:rgba(79,195,247,.15);
  --inp:rgba(2,8,25,.9);--hdr:rgba(4,8,22,.99);--row:rgba(255,255,255,.025);
  --sep:rgba(79,195,247,.07);--sb:rgba(5,10,28,.97);
  --shadow:0 8px 32px rgba(0,0,0,.6);
}
[data-theme="light"]{
  --bg:#eef2fa;--surface:#fff;--card:#f4f8ff;
  --accent:#1565c0;--accent2:#6200ea;--gold:#f57f17;--ok:#2e7d32;--err:#c62828;
  --text:#0d1b2a;--muted:#546e7a;--border:rgba(21,101,192,.18);
  --inp:#e8f0fe;--hdr:#ddeeff;--row:rgba(0,0,0,.018);
  --sep:rgba(0,0,0,.07);--sb:#dce6f7;
  --shadow:0 4px 20px rgba(0,0,0,.12);
}
html,body{height:100%;font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;overflow:hidden;}

/* ====== LAYOUT ====== */
#app{display:flex;height:100vh;}

/* sidebar */
#sidebar{
  width:240px;flex-shrink:0;background:var(--sb);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
}
.sb-logo{
  display:flex;align-items:center;gap:10px;padding:18px 16px 14px;
  border-bottom:1px solid var(--border);
}
.sb-logo svg{width:36px;height:36px;flex-shrink:0}
.sb-logo-text{flex:1}
.sb-logo-name{font-size:1.1rem;font-weight:900;color:var(--accent);letter-spacing:-.02em}
.sb-logo-tag{font-size:.65rem;color:var(--muted);margin-top:1px}

.sb-stats{
  display:flex;gap:0;border-bottom:1px solid var(--border);
}
.sb-stat{flex:1;text-align:center;padding:8px 4px;border-right:1px solid var(--border);}
.sb-stat:last-child{border-right:none}
.sb-stat-n{font-size:1.1rem;font-weight:800;color:var(--accent)}
.sb-stat-l{font-size:.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

.sb-section{padding:8px 10px 4px;font-size:.6rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);}
.cat-btn{
  display:flex;align-items:center;gap:8px;
  padding:7px 14px;cursor:pointer;border-radius:6px;margin:1px 6px;
  font-size:.82rem;transition:.15s;border:none;background:none;color:var(--text);width:calc(100% - 12px);text-align:left;
}
.cat-btn:hover{background:rgba(79,195,247,.08);color:var(--accent)}
.cat-btn.active{background:rgba(79,195,247,.14);color:var(--accent);font-weight:700}
.cat-btn .cat-cnt{margin-left:auto;font-size:.7rem;background:rgba(79,195,247,.15);padding:1px 7px;border-radius:8px;color:var(--accent);}

.sb-spacer{flex:1}
.sb-bottom{border-top:1px solid var(--border);padding:8px;display:flex;flex-direction:column;gap:4px;}
.sb-btn{
  display:flex;align-items:center;gap:8px;padding:7px 10px;
  border-radius:6px;cursor:pointer;font-size:.8rem;transition:.15s;
  border:none;background:none;color:var(--muted);width:100%;text-align:left;
}
.sb-btn:hover{background:rgba(79,195,247,.08);color:var(--accent)}
.sb-btn.active{color:var(--accent)}
.sb-sync-info{font-size:.65rem;color:var(--muted);padding:4px 10px;text-align:center;}

/* main */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}

/* topbar */
.topbar{
  background:var(--hdr);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;padding:10px 20px;flex-shrink:0;
}
.search-wrap{flex:1;max-width:520px;position:relative;}
.search-inp{
  width:100%;background:var(--inp);border:1px solid var(--border);
  border-radius:8px;color:var(--text);font-size:.85rem;padding:7px 14px 7px 34px;
}
.search-inp:focus{outline:none;border-color:var(--accent)}
.search-inp::placeholder{color:var(--muted)}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.9rem;pointer-events:none;}
.topbar-right{display:flex;align-items:center;gap:8px;margin-left:auto;}
.tb-btn{
  border:1px solid var(--border);border-radius:8px;background:none;
  color:var(--muted);cursor:pointer;padding:6px 14px;font-size:.78rem;
  display:flex;align-items:center;gap:5px;transition:.15s;white-space:nowrap;
}
.tb-btn:hover{color:var(--accent);border-color:var(--accent);background:rgba(79,195,247,.07)}
.tb-btn.primary{background:var(--accent);color:#000;border-color:var(--accent);font-weight:700;}
.tb-btn.primary:hover{filter:brightness(1.1)}
.tb-btn.danger:hover{color:var(--err);border-color:var(--err)}

/* content */
#content{flex:1;overflow-y:auto;padding:20px;}

/* card grid */
.cards-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:16px;
}

.group-card{
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  transition:box-shadow .2s,border-color .2s;overflow:hidden;
}
.group-card:hover{box-shadow:var(--shadow);border-color:rgba(79,195,247,.3)}
.group-card.dragging{opacity:.3}
.group-card.drag-over{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}

.card-hdr{
  display:flex;align-items:center;gap:10px;padding:12px 14px;
  cursor:pointer;border-bottom:1px solid transparent;transition:.15s;
}
.card-hdr:hover{background:rgba(79,195,247,.04)}
.card-hdr.open{border-bottom-color:var(--sep)}
.drag-h{color:var(--muted);cursor:grab;font-size:1rem;flex-shrink:0;opacity:.5;}
.drag-h:active{cursor:grabbing}
.c-icon{font-size:1.4rem;flex-shrink:0;}
.c-info{flex:1;min-width:0}
.c-name{font-weight:700;font-size:.9rem;color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.c-note{font-size:.72rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px;}
.c-badge{font-size:.65rem;background:rgba(79,195,247,.12);color:var(--accent);padding:2px 8px;border-radius:10px;flex-shrink:0;}
.card-actions{display:flex;gap:2px;flex-shrink:0;}
.ic-btn{background:none;border:none;cursor:pointer;color:var(--muted);padding:4px 6px;border-radius:5px;font-size:.85rem;line-height:1;transition:.15s;}
.ic-btn:hover{color:var(--accent);background:rgba(79,195,247,.1)}
.ic-btn.d:hover{color:var(--err)}

.card-rows{display:none;}
.card-rows.open{display:block;}
.row-item{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--sep);}
.row-item:last-child{border-bottom:none}
.row-label{font-size:.72rem;color:var(--muted);width:100px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.row-val-wrap{flex:1;min-width:0;}
.row-inp{width:100%;background:transparent;border:none;color:var(--text);font-size:.85rem;font-family:'Consolas','Courier New',mono;padding:0;outline:none;}
.row-inp.pwd{font-family:inherit;letter-spacing:.06em;}
.row-btns{display:flex;gap:2px;flex-shrink:0;}
.r-btn{background:none;border:none;cursor:pointer;color:var(--muted);padding:3px 6px;border-radius:4px;font-size:.8rem;line-height:1;transition:.15s;}
.r-btn:hover{color:var(--accent);background:rgba(79,195,247,.1)}
.r-btn.copied{color:var(--ok)}

.add-card-btn{
  border:2px dashed var(--border);border-radius:12px;
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:24px;cursor:pointer;color:var(--muted);font-size:.85rem;
  transition:.2s;min-height:80px;
}
.add-card-btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(79,195,247,.04)}

.empty-state{text-align:center;padding:60px 20px;color:var(--muted);}
.empty-state .e-icon{font-size:3rem;margin-bottom:12px;}
.empty-state .e-title{font-size:1rem;font-weight:700;margin-bottom:6px;color:var(--text);}

/* ====== SCREENS ====== */
.screen{display:none;}
.screen.active{display:flex;}

/* LANG screen */
#screenLang{
  position:fixed;inset:0;z-index:200;
  background:linear-gradient(135deg,#060810 0%,#0a1428 60%,#090520 100%);
  flex-direction:column;align-items:center;justify-content:center;
}
.lang-box{width:100%;max-width:480px;padding:0 20px;text-align:center;}
.lang-logo{margin-bottom:24px;}
.lang-logo svg{width:72px;height:72px;}
.lang-title{font-size:1.6rem;font-weight:900;color:var(--accent);margin-bottom:4px;}
.lang-sub{font-size:.85rem;color:var(--muted);margin-bottom:28px;}
.lang-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:24px;}
.lang-opt{
  display:flex;align-items:center;gap:10px;padding:12px 16px;
  border:2px solid var(--border);border-radius:10px;cursor:pointer;
  transition:.15s;background:var(--card);
}
.lang-opt:hover{border-color:var(--accent)}
.lang-opt.selected{border-color:var(--accent);background:rgba(79,195,247,.1)}
.lang-flag{font-size:1.4rem;}
.lang-label{font-size:.88rem;font-weight:600;text-align:left;}
.lang-cont{
  background:var(--accent);color:#000;border:none;border-radius:10px;
  padding:12px 32px;font-size:.95rem;font-weight:800;cursor:pointer;transition:.15s;
}
.lang-cont:hover{filter:brightness(1.1)}

/* LOCK screen */
#screenLock{
  position:fixed;inset:0;z-index:190;
  background:linear-gradient(135deg,#060810,#0a1428);
  flex-direction:column;align-items:center;justify-content:center;
}
.lock-box{width:360px;text-align:center;}
.lock-icon-wrap{margin-bottom:20px;}
.lock-icon-wrap svg{width:64px;height:64px;}
.lock-title{font-size:1.3rem;font-weight:900;color:var(--accent);margin-bottom:4px;}
.lock-sub{font-size:.8rem;color:var(--muted);margin-bottom:24px;}
.lock-storage-badge{
  display:inline-flex;align-items:center;gap:6px;
  border:1px solid var(--border);border-radius:20px;
  padding:4px 12px;font-size:.75rem;color:var(--muted);margin-bottom:20px;
}
.lock-inp{
  width:100%;background:var(--inp);border:1px solid var(--border);
  border-radius:10px;color:var(--text);font-size:1rem;padding:12px 16px;
  text-align:center;letter-spacing:.06em;margin-bottom:12px;
}
.lock-inp:focus{outline:none;border-color:var(--accent)}
.lock-btn{
  width:100%;background:var(--accent);color:#000;border:none;
  border-radius:10px;padding:12px;font-size:.95rem;font-weight:800;cursor:pointer;transition:.15s;
}
.lock-btn:hover{filter:brightness(1.12)}
.lock-err{color:var(--err);font-size:.78rem;margin-top:8px;min-height:18px;}
.lock-links{display:flex;justify-content:center;gap:20px;margin-top:16px;}
.lock-link{color:var(--muted);font-size:.75rem;cursor:pointer;text-decoration:underline;}
.lock-link:hover{color:var(--accent)}

/* SETUP screens */
#screenSetup{
  position:fixed;inset:0;z-index:180;
  background:linear-gradient(135deg,#060810,#0a1428);
  flex-direction:column;align-items:center;justify-content:flex-start;
  overflow-y:auto;padding:40px 20px;
}
.setup-box{width:100%;max-width:600px;}
.setup-header{text-align:center;margin-bottom:32px;}
.setup-header svg{width:48px;height:48px;margin-bottom:12px;}
.setup-title{font-size:1.2rem;font-weight:900;color:var(--accent);margin-bottom:6px;}
.setup-hint{font-size:.8rem;color:var(--muted);}

.storage-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px;}
@media(max-width:560px){.storage-grid{grid-template-columns:repeat(2,1fr);}}
.storage-opt{
  border:2px solid var(--border);border-radius:10px;padding:12px;
  cursor:pointer;transition:.15s;background:var(--card);text-align:center;
}
.storage-opt:hover{border-color:var(--accent)}
.storage-opt.selected{border-color:var(--accent);background:rgba(79,195,247,.1)}
.s-icon{font-size:1.6rem;margin-bottom:6px;}
.s-label{font-size:.75rem;font-weight:700;color:var(--accent);margin-bottom:2px;}
.s-desc{font-size:.65rem;color:var(--muted);}

.setup-fields{
  background:var(--inp);border:1px solid var(--border);
  border-radius:10px;padding:16px;margin-bottom:16px;
}
.sf-row{margin-bottom:10px;}
.sf-row:last-child{margin-bottom:0}
.sf-label{font-size:.65rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:3px;}
.sf-inp{
  width:100%;background:var(--bg);border:1px solid var(--border);
  border-radius:7px;color:var(--text);font-size:.85rem;padding:7px 12px;
}
.sf-inp:focus{outline:none;border-color:var(--accent)}
.sf-hint{font-size:.68rem;color:var(--muted);margin-top:3px;}

.pwd-section{background:var(--inp);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px;}
.pwd-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.pwd-row:last-child{margin-bottom:0}
.pwd-label{font-size:.65rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);width:120px;flex-shrink:0;}
.pwd-inp{
  flex:1;background:var(--bg);border:1px solid var(--border);
  border-radius:7px;color:var(--text);font-size:.88rem;padding:8px 12px;
}
.pwd-inp:focus{outline:none;border-color:var(--accent)}
.pwd-hint{font-size:.7rem;color:var(--muted);text-align:center;margin-bottom:8px;}

.setup-btn{
  width:100%;background:var(--accent);color:#000;border:none;
  border-radius:10px;padding:12px;font-size:.9rem;font-weight:800;
  cursor:pointer;transition:.15s;
}
.setup-btn:hover{filter:brightness(1.12)}
.setup-err{color:var(--err);font-size:.78rem;text-align:center;margin-top:8px;min-height:16px;}

/* SETTINGS panel */
#panelSettings{
  position:fixed;top:0;right:0;bottom:0;width:420px;z-index:150;
  background:var(--surface);border-left:1px solid var(--border);
  display:none;flex-direction:column;overflow:hidden;
  box-shadow:-8px 0 32px rgba(0,0,0,.4);
}
#panelSettings.open{display:flex;}
.panel-hdr{
  display:flex;align-items:center;gap:10px;
  padding:16px 20px;border-bottom:1px solid var(--border);
  background:var(--hdr);flex-shrink:0;
}
.panel-hdr h2{flex:1;font-size:.95rem;color:var(--accent);}
.panel-close{background:none;border:none;cursor:pointer;color:var(--muted);font-size:1.2rem;padding:4px;border-radius:5px;transition:.15s;}
.panel-close:hover{color:var(--err)}
.panel-body{flex:1;overflow-y:auto;padding:16px 20px;}
.ps-section{margin-bottom:20px;}
.ps-title{
  font-size:.65rem;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);
  margin-bottom:10px;padding-bottom:5px;
  border-bottom:1px solid var(--sep);
}
.ps-row{display:flex;align-items:center;padding:8px 0;gap:10px;border-bottom:1px solid var(--sep);}
.ps-row:last-child{border-bottom:none}
.ps-row-info{flex:1;}
.ps-row-label{font-size:.82rem;font-weight:600;}
.ps-row-desc{font-size:.7rem;color:var(--muted);margin-top:1px;}
.ps-btn{
  border:1px solid var(--border);border-radius:7px;background:none;
  color:var(--text);cursor:pointer;padding:5px 14px;font-size:.78rem;transition:.15s;white-space:nowrap;
}
.ps-btn:hover{border-color:var(--accent);color:var(--accent)}
.ps-btn.active{background:rgba(79,195,247,.1);color:var(--accent);border-color:var(--accent);}
.ps-btn.danger{border-color:rgba(239,83,80,.3);color:var(--err);}
.ps-btn.danger:hover{background:rgba(239,83,80,.08)}
.toggle{
  width:40px;height:22px;border-radius:11px;background:var(--muted);cursor:pointer;
  border:none;position:relative;transition:.25s;flex-shrink:0;
}
.toggle.on{background:var(--accent);}
.toggle::after{
  content:'';position:absolute;top:3px;left:3px;
  width:16px;height:16px;border-radius:50%;background:#fff;
  transition:.25s;box-shadow:0 1px 4px rgba(0,0,0,.3);
}
.toggle.on::after{left:21px;}
.cs-current{
  display:flex;align-items:center;gap:10px;padding:10px 12px;
  background:rgba(79,195,247,.07);border:1px solid var(--border);
  border-radius:8px;margin-bottom:10px;
}
.cs-icon{font-size:1.3rem;}.cs-name{flex:1;font-weight:700;color:var(--accent);font-size:.85rem;}
.cs-status{font-size:.72rem;}.cs-ok{color:var(--ok)}.cs-err{color:var(--err)}

/* Export buttons */
.export-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.exp-btn{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  border:1px solid var(--border);border-radius:8px;padding:10px;
  cursor:pointer;background:var(--card);transition:.15s;font-size:.75rem;
  color:var(--text);
}
.exp-btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(79,195,247,.07)}
.exp-btn .exp-icon{font-size:1.4rem;}
.exp-btn .exp-label{font-weight:600;}
.exp-btn .exp-desc{font-size:.65rem;color:var(--muted);}

/* MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:300;align-items:center;justify-content:center;}
.overlay.open{display:flex;}
.modal{
  background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:24px;width:480px;max-height:80vh;overflow-y:auto;
  box-shadow:0 24px 64px rgba(0,0,0,.7);
}
.modal h3{font-size:1rem;color:var(--accent);margin-bottom:16px;}
.m-label{font-size:.65rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:10px 0 4px;}
.m-label:first-of-type{margin-top:0}
.m-inp,.m-sel,.m-ta{
  width:100%;background:var(--inp);border:1px solid var(--border);
  border-radius:7px;color:var(--text);font-size:.85rem;padding:7px 12px;font-family:inherit;
}
.m-inp:focus,.m-sel:focus,.m-ta:focus{outline:none;border-color:var(--accent)}
.m-ta{resize:vertical;min-height:70px;}
.emoji-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;}
.emoji-btn{background:none;border:2px solid transparent;border-radius:6px;font-size:1.3rem;cursor:pointer;padding:3px 5px;line-height:1;transition:.12s;}
.emoji-btn:hover,.emoji-btn.sel{border-color:var(--accent);background:rgba(79,195,247,.1)}

.mrow-list{display:flex;flex-direction:column;gap:6px;margin-top:6px;}
.mrow-item{display:flex;gap:6px;align-items:center;}
.mrow-item input,.mrow-item select{flex:1;}
.mrow-rm{background:none;border:none;color:var(--muted);cursor:pointer;font-size:.95rem;padding:3px 5px;border-radius:4px;transition:.15s;}
.mrow-rm:hover{color:var(--err)}
.add-mrow{
  background:none;border:1px dashed var(--border);border-radius:7px;
  color:var(--muted);cursor:pointer;width:100%;padding:6px;font-size:.78rem;margin-top:6px;transition:.15s;
}
.add-mrow:hover{color:var(--accent);border-color:var(--accent)}
.m-btns{display:flex;gap:10px;margin-top:18px;justify-content:flex-end;}
.m-save{background:var(--accent);color:#000;border:none;border-radius:8px;padding:8px 20px;cursor:pointer;font-size:.85rem;font-weight:700;}
.m-save:hover{filter:brightness(1.12)}
.m-cancel{background:transparent;color:var(--muted);border:1px solid var(--border);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:.85rem;}
.m-cancel:hover{color:var(--text)}

/* Confirm modal */
.confirm-box{max-width:340px;}
.confirm-box p{font-size:.85rem;color:var(--muted);margin-top:6px;}
.confirm-del{background:var(--err);color:#fff;border:none;border-radius:8px;padding:8px 18px;cursor:pointer;font-size:.85rem;font-weight:700;}

/* lang selector in settings */
.lang-list{display:flex;flex-direction:column;gap:4px;}
.lang-item{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:6px;cursor:pointer;border:1px solid transparent;transition:.15s;font-size:.82rem;}
.lang-item:hover{background:rgba(79,195,247,.07)}
.lang-item.active{border-color:var(--accent);background:rgba(79,195,247,.09);color:var(--accent);font-weight:700;}

/* scrollbar */
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:rgba(79,195,247,.22);border-radius:4px}
.hidden{display:none!important}

/* update badge */
.update-badge{
  display:inline-block;background:var(--gold);color:#000;
  font-size:.65rem;font-weight:800;padding:2px 7px;border-radius:8px;margin-left:6px;
}
</style>
</head>
<body>

<!-- LANG SELECT -->
<div id="screenLang" class="screen">
  <div class="lang-box">
    <div class="lang-logo" id="langLogo"></div>
    <div class="lang-title">VaultNova</div>
    <div class="lang-sub" id="langSub">Choose your language / Выберите язык</div>
    <div class="lang-grid" id="langGrid"></div>
    <button class="lang-cont" id="langCont">→ Continue</button>
  </div>
</div>

<!-- LOCK -->
<div id="screenLock" class="screen">
  <div class="lock-box">
    <div class="lock-icon-wrap" id="lockLogo"></div>
    <div class="lock-title">VaultNova</div>
    <div class="lock-sub" id="lockSub"></div>
    <div class="lock-storage-badge" id="lockBadge"><span id="lockBadgeIcon">💻</span><span id="lockBadgeLabel">Local</span></div>
    <input id="lockPwd" class="lock-inp" type="password" placeholder="••••••••" autocomplete="off">
    <button class="lock-btn" id="lockBtn"></button>
    <div class="lock-err" id="lockErr"></div>
    <div class="lock-links">
      <span class="lock-link" id="lockChangeStorage"></span>
      <span class="lock-link" id="lockSettings"></span>
    </div>
  </div>
</div>

<!-- SETUP -->
<div id="screenSetup" class="screen">
  <div class="setup-box">
    <div class="setup-header">
      <div id="setupLogo"></div>
      <div class="setup-title" id="setupTitle"></div>
      <div class="setup-hint" id="setupHint"></div>
    </div>
    <div class="storage-grid" id="storageGrid"></div>
    <div class="setup-fields" id="setupFields" style="display:none"></div>
    <div class="pwd-section">
      <div class="pwd-hint" id="pwdHint"></div>
      <div class="pwd-row">
        <div class="pwd-label" id="pwdLabel1"></div>
        <input id="setupPwd" class="pwd-inp" type="password" autocomplete="new-password">
      </div>
      <div class="pwd-row">
        <div class="pwd-label" id="pwdLabel2"></div>
        <input id="setupPwd2" class="pwd-inp" type="password" autocomplete="new-password">
      </div>
    </div>
    <button class="setup-btn" id="setupBtn"></button>
    <div class="setup-err" id="setupErr"></div>
    <div style="text-align:center;margin-top:12px;">
      <button class="lock-link" id="setupBackBtn" style="border:none;background:none;cursor:pointer;font-size:.78rem;"></button>
    </div>
  </div>
</div>

<!-- MAIN APP -->
<div id="app" style="display:none">
  <!-- Sidebar -->
  <div id="sidebar">
    <div class="sb-logo">
      <div id="sidebarLogo"></div>
      <div class="sb-logo-text">
        <div class="sb-logo-name">VaultNova</div>
        <div class="sb-logo-tag" id="sbTag"></div>
      </div>
    </div>
    <div class="sb-stats">
      <div class="sb-stat"><div class="sb-stat-n" id="statTotal">0</div><div class="sb-stat-l" id="statTotalL"></div></div>
      <div class="sb-stat"><div class="sb-stat-n" id="statSyncTime">—</div><div class="sb-stat-l" id="statSyncL"></div></div>
    </div>
    <div class="sb-section" id="sbCatLabel"></div>
    <div id="catsList"></div>
    <div class="sb-spacer"></div>
    <div class="sb-bottom">
      <button class="sb-btn" id="sbBtnSettings">⚙️ <span id="sbSettingsLabel"></span></button>
      <button class="sb-btn" id="sbBtnSync">↻ <span id="sbSyncLabel"></span></button>
      <button class="sb-btn" id="sbBtnLock">🔒 <span id="sbLockLabel"></span></button>
    </div>
    <div class="sb-sync-info" id="sbSyncInfo"></div>
  </div>

  <!-- Main -->
  <div id="main">
    <div class="topbar">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input class="search-inp" id="searchInp" type="text">
      </div>
      <div class="topbar-right">
        <button class="tb-btn primary" id="btnAdd"></button>
        <button class="tb-btn" id="btnTheme">🌙/☀️</button>
      </div>
    </div>
    <div id="content">
      <div class="cards-grid" id="cardsGrid"></div>
    </div>
  </div>
</div>

<!-- SETTINGS PANEL -->
<div id="panelSettings">
  <div class="panel-hdr">
    <h2 id="psTitle"></h2>
    <button class="panel-close" id="psClose">×</button>
  </div>
  <div class="panel-body" id="panelBody"></div>
</div>

<!-- GROUP MODAL -->
<div class="overlay" id="modalGroup">
  <div class="modal">
    <h3 id="mgTitle"></h3>
    <div class="emoji-row" id="mgEmojis"></div>
    <div class="m-label" id="mlIcon"></div>
    <input class="m-inp" id="mgIcon" maxlength="4" autocomplete="off">
    <div class="m-label" id="mlName"></div>
    <input class="m-inp" id="mgName" autocomplete="off">
    <div class="m-label" id="mlNote"></div>
    <input class="m-inp" id="mgNote" autocomplete="off">
    <div class="m-label" id="mlCat"></div>
    <select class="m-sel" id="mgCat"></select>
    <div class="m-label" id="mlFields"></div>
    <div class="mrow-list" id="mgRows"></div>
    <button class="add-mrow" id="mgAddRow"></button>
    <div class="m-btns">
      <button class="m-cancel" id="mgCancel"></button>
      <button class="m-save" id="mgSave"></button>
    </div>
  </div>
</div>

<!-- CONFIRM MODAL -->
<div class="overlay" id="modalConfirm">
  <div class="modal confirm-box">
    <h3 style="color:var(--err)" id="confirmTitle"></h3>
    <p id="confirmText"></p>
    <div class="m-btns">
      <button class="m-cancel" id="confirmNo"></button>
      <button class="confirm-del" id="confirmYes"></button>
    </div>
  </div>
</div>

<script src="crypto.js"></script>
<script src="storage.js"></script>
<script src="i18n.js"></script>
<script src="tab.js"></script>
</body>
</html>
